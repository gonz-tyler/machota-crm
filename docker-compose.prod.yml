version: "3.8"

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    # Port 3306 is hidden from the internet for security. Only 'backend' can talk to it.
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    restart: always
    # Gunicorn handles multi-threaded web workers natively
    # command: gunicorn machotacrm.wsgi:application --bind 0.0.0.0:8000 --workers 3
    command: >
      sh -c "python manage.py migrate --noinput &&
            python manage.py collectstatic --noinput &&
            gunicorn machotacrm.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - media_data:/app/media
      - static_data:/app/static
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: always
    volumes:
      - frontend_build:/usr/share/nginx/html

  nginx:
    image: nginx:alpine # was missing entirely
    restart: always
    ports:
      - "80:80"
      - "443:443" # add this
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/static:ro
      - frontend_build:/usr/share/nginx/html:ro
      - certbot_certs:/etc/letsencrypt:ro # add this
      - certbot_www:/var/www/certbot:ro # add this

  certbot: # add this service
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  mysql_data:
  media_data:
  static_data:
  frontend_build:
  certbot_certs:
  certbot_www:
